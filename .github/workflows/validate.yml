name: Validate SideStore source

on:
  push:
    paths:
      - "source.json"
      - "scripts/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "source.json"
      - "scripts/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate source
        run: python3 scripts/validate_source.py source.json

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check upstream URLs
        run: python3 scripts/check_links.py source.json
